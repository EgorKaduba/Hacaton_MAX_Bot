schemaVersion: "1.0"

solution:
  name: "КвитДом"
  teamId: "<team id>"

api:
  baseUrl: "https://kvitdom-bot.ru/api"
  openapi: "./openapi.json"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "upload-receipt"
    name: "Загрузка квитанции"
    description: "Принимает PDF-квитанцию и сохраняет её в БД"
    method: "POST"
    path: "/receipts/upload/{max_user_id}"
    role: "public"
    request:
      path:
        max_user_id: 1
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "period_month"
        - "total_without_insurance"
    timeoutMs: 10000
    repeatable: false
    extract:
      receiptId: "$.id"

  - id: "get-receipts-list"
    name: "Список квитанций пользователя"
    description: "Возвращает список квитанций по max_user_id"
    method: "GET"
    path: "/receipts/user/{max_user_id}"
    role: "public"
    request:
      path:
        max_user_id: 1
    expected:
      statusCodes: [200]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: true

  - id: "get-receipt-detail"
    name: "Детали квитанции"
    description: "Возвращает квитанцию со всеми связанными данными"
    method: "GET"
    path: "/receipts/{receipt_id}"
    role: "public"
    dependsOn:
      - "upload-receipt"
    request:
      path:
        receipt_id: "${receiptId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "id"
        - "period_month"
    timeoutMs: 5000
    repeatable: true

  - id: "check-receipt"
    name: "Проверка квитанции на ошибки"
    description: "Анализирует начисления и возвращает найденные ошибки"
    method: "POST"
    path: "/receipts/check/{receipt_id}"
    role: "public"
    dependsOn:
      - "upload-receipt"
    request:
      path:
        receipt_id: "${receiptId}"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields:
        - "receipt_id"
        - "has_errors"
        - "errors"
    timeoutMs: 10000
    repeatable: true

  - id: "get-complaint"
    name: "Скачать жалобу по квитанции"
    description: "Формирует PDF-жалобу по найденным ошибкам квитанции"
    method: "GET"
    path: "/receipts/{receipt_id}/complaint"
    role: "public"
    dependsOn:
      - "upload-receipt"
      - "check-receipt"
    request:
      path:
        receipt_id: "${receiptId}"
    expected:
      statusCodes: [200]
      contentType: "application/pdf"
    timeoutMs: 10000
    repeatable: true

  - id: "get-analytics"
    name: "Аналитика расходов"
    description: "Возвращает динамику по месяцам, метрики и категории"
    method: "GET"
    path: "/analytics"
    role: "public"
    request:
      query:
        max_user_id: 1
        period: "half_year"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "period"
        - "points"
        - "summary"
    timeoutMs: 5000
    repeatable: true

  - id: "get-analytics-categories"
    name: "Категории расходов за месяц"
    description: "Возвращает категории расходов за конкретный месяц"
    method: "GET"
    path: "/analytics/categories"
    role: "public"
    request:
      query:
        max_user_id: 1
        year: 2026
        month: 8
    expected:
      statusCodes: [200]
      contentType: "application/json"
    timeoutMs: 5000
    repeatable: true

  - id: "ai-chat"
    name: "AI-помощник"
    description: "Отвечает на вопросы по квитанциям"
    method: "POST"
    path: "/ai/chat"
    role: "public"
    request:
      headers:
        Content-Type: "application/json"
      body:
        max_user_id: 1
        message: "Какая итоговая сумма в последней квитанции?"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields:
        - "answer"
    timeoutMs: 30000
    repeatable: true

cleanup: []